name: Arrow Puzzle Tests

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: Flutter Analyze & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Create Android project
        run: flutter create --platforms=android .

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test