name: Arrow Puzzle CI

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      build_apk:
        description: "Build Android APK after test"
        required: true
        default: false
        type: boolean

jobs:
  test:
    name: Godot Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: "4.5.1"
          use-dotnet: false
          include-templates: true

      - name: Check project
        run: |
          godot --headless --editor --quit

      - name: Run project test
        run: |
          timeout 30 godot --headless --path . --quit-after 5

  build:
    name: Build Android APK
    needs: test
    if: ${{ github.event_name == 'push' || inputs.build_apk == true }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: "4.5.1"
          use-dotnet: false
          include-templates: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Import Godot project
        run: |
          godot --headless --editor --quit

      - name: Build Android APK
        run: |
          mkdir -p build
          godot \
            --headless \
            --path . \
            --export-debug "Android" \
            build/arrow-puzzle.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: arrow-puzzle-apk
          path: build/arrow-puzzle.apk
          if-no-files-found: error